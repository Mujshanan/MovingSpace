[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movingspace"
version = "0.1.0.dev0"
description = "Research tools for sensitivity analysis in parameter-dependent Galerkin spaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet selected; this repository is currently private." }
authors = [{ name = "Mujtaba Shanan" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
